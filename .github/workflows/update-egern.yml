name: Publish Egern rules

# The daily schedule lives in the copy of this workflow on main.
on:
  workflow_dispatch:
  push:
    branches: [egern]
    paths:
      - ".github/workflows/update-egern.yml"
      - "config/**"
      - "src/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: publish-egern-rules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: egern
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests
      - run: python src/build_rules.py
      - name: Commit changed rules
        run: |
          git add -- rules
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -m "chore: publish native Egern rules"
            git push origin HEAD:refs/heads/egern
          fi
