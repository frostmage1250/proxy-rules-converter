name: Publish Egern rules

# Schedules only run from the default branch, so this entry lives on main and
# builds the egern branch with that branch's own Python converter.
on:
  workflow_dispatch:
  schedule:
    - cron: "50 2 * * *"

permissions:
  contents: write

concurrency:
  group: publish-egern-rules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out egern branch
        uses: actions/checkout@v6
        with:
          ref: egern

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build native Egern rules
        run: python src/build_rules.py

      - name: Commit and push changed rules
        shell: bash
        run: |
          set -euo pipefail
          git add -- rules
          if git diff --cached --quiet; then
            echo "No Egern rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: publish native Egern rules"
          git push origin HEAD:refs/heads/egern
