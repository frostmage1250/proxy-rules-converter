name: Update generated rules

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-rules.yml"
      - "config/**"
      - "src/**"
      - "tests/**"
  schedule:
    # 18:23 UTC = 02:23 Asia/Shanghai (the following day).
    - cron: "23 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-generated-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Go for official rule generators
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install latest stable official Mihomo converter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh api repos/MetaCubeX/mihomo/releases/latest)"
          mihomo_version="$(jq --raw-output '.tag_name' <<< "${release_json}")"
          asset="mihomo-linux-amd64-compatible-${mihomo_version}.gz"
          asset_json="$(
            jq --compact-output --arg name "${asset}" \
              '.assets[] | select(.name == $name)' <<< "${release_json}"
          )"
          download_url="$(jq --raw-output '.browser_download_url' <<< "${asset_json}")"
          digest="$(jq --raw-output '.digest' <<< "${asset_json}")"
          if [[ -z "${asset_json}" || "${digest}" != sha256:* ]]; then
            echo "Latest stable Mihomo release is missing ${asset} or its SHA-256 digest." >&2
            exit 1
          fi
          archive="${RUNNER_TEMP}/${asset}"
          curl --fail --location --silent --show-error \
            "${download_url}" \
            --output "${archive}"
          echo "${digest#sha256:}  ${archive}" | sha256sum --check
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod +x "${RUNNER_TEMP}/mihomo"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          echo "Using latest stable Mihomo ${mihomo_version}."
          "${RUNNER_TEMP}/mihomo" -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch, convert, and validate rules
        run: |
          python src/convert_rules.py
          python src/convert_mrs.py

      - name: Build official V2Fly geolocation-cn with MetaCubeX
        shell: bash
        run: |
          set -euo pipefail
          v2fly_root="${RUNNER_TEMP}/domain-list-community"
          v2fly_output="${RUNNER_TEMP}/v2fly-output"
          converter_root="${RUNNER_TEMP}/meta-rules-converter"
          meta_output="${RUNNER_TEMP}/meta-output"

          git clone --depth 1 \
            https://github.com/v2fly/domain-list-community.git \
            "${v2fly_root}"
          cp config/v2fly/geolocation-cn-clean \
            "${v2fly_root}/data/geolocation-cn-clean"
          mkdir -p "${v2fly_output}"
          (
            cd "${v2fly_root}"
            go run . \
              --datprofile="${GITHUB_WORKSPACE}/config/v2fly/dat-profile.json" \
              --outputdir="${v2fly_output}" \
              --exportlists=geolocation-cn-clean
          )

          git clone --depth 1 \
            https://github.com/MetaCubeX/meta-rules-converter.git \
            "${converter_root}"
          (
            cd "${converter_root}"
            go build -trimpath -o "${RUNNER_TEMP}/meta-rules-converter-bin" .
          )
          "${RUNNER_TEMP}/meta-rules-converter-bin" geosite \
            -f "${v2fly_output}/geolocation-cn.dat" \
            -o "${meta_output}"

          install -m 0644 "${meta_output}/geolocation-cn-clean.list" \
            dist/mihomo/geolocation-cn.list
          install -m 0644 "${meta_output}/geolocation-cn-clean.mrs" \
            dist/mihomo/geolocation-cn.mrs
          python src/convert_geolocation_cn_shadowrocket.py \
            --input dist/mihomo/geolocation-cn.list \
            --output dist/shadowrocket/geolocation-cn.domain-set
          python src/validate_geolocation_cn.py \
            --v2fly-export "${v2fly_output}/geolocation-cn-clean.txt" \
            --meta-list dist/mihomo/geolocation-cn.list \
            --meta-mrs dist/mihomo/geolocation-cn.mrs \
            --v2fly-commit "$(git -C "${v2fly_root}" rev-parse HEAD)" \
            --converter-commit "$(git -C "${converter_root}" rev-parse HEAD)" \
            --report reports/geolocation-cn.json

      - name: Verify generated files are deterministic
        run: |
          python src/convert_rules.py --check
          python src/convert_mrs.py --check
          python src/convert_geolocation_cn_shadowrocket.py --check
          git diff --check

      - name: Commit changed generated files
        shell: bash
        run: |
          git add -A -- dist reports
          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push
