name: Update generated rules

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-rules.yml"
      - "config/**"
      - "src/**"
      - "tests/**"
  schedule:
    # Every 6 hours, after Mihomo and before Egern (UTC).
    - cron: "23 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: update-generated-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Egern rule conversion dependency
        run: python -m pip install --requirement requirements.txt

      - name: Set up Go for official rule generators
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install latest stable official Mihomo converter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh api repos/MetaCubeX/mihomo/releases/latest)"
          mihomo_version="$(jq --raw-output '.tag_name' <<< "${release_json}")"
          asset="mihomo-linux-amd64-compatible-${mihomo_version}.gz"
          asset_json="$(
            jq --compact-output --arg name "${asset}" \
              '.assets[] | select(.name == $name)' <<< "${release_json}"
          )"
          download_url="$(jq --raw-output '.browser_download_url' <<< "${asset_json}")"
          digest="$(jq --raw-output '.digest' <<< "${asset_json}")"
          if [[ -z "${asset_json}" || "${digest}" != sha256:* ]]; then
            echo "Latest stable Mihomo release is missing ${asset} or its SHA-256 digest." >&2
            exit 1
          fi
          archive="${RUNNER_TEMP}/${asset}"
          curl --fail --location --silent --show-error \
            "${download_url}" \
            --output "${archive}"
          echo "${digest#sha256:}  ${archive}" | sha256sum --check
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod +x "${RUNNER_TEMP}/mihomo"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          echo "Using latest stable Mihomo ${mihomo_version}."
          "${RUNNER_TEMP}/mihomo" -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch, convert, and validate rules
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/xianhongtao/AdGuard-AntiPCDN-Rules/refs/heads/main/adguard.txt" \
            --output "${RUNNER_TEMP}/mcdn-adguard.txt"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/classical/category-porn.list" \
            --output "${RUNNER_TEMP}/category-porn.list"
          python src/convert_rules.py --mcdn-source "${RUNNER_TEMP}/mcdn-adguard.txt" --porn-source "${RUNNER_TEMP}/category-porn.list"
          python src/convert_mrs.py

      - name: Extend Bett AI MRS
        run: python src/build_ai_mrs.py

      - name: Build V2Fly geolocation-cn and compile MRS
        shell: bash
        run: |
          set -euo pipefail
          v2fly_root="${RUNNER_TEMP}/domain-list-community"
          v2fly_output="${RUNNER_TEMP}/v2fly-output"
          converter_root="${RUNNER_TEMP}/meta-rules-converter"
          meta_output="${RUNNER_TEMP}/meta-output"

          git clone --depth 1 \
            https://github.com/v2fly/domain-list-community.git \
            "${v2fly_root}"
          cp config/v2fly/geolocation-cn-clean \
            "${v2fly_root}/data/geolocation-cn-clean"
          mkdir -p "${v2fly_output}"
          (
            cd "${v2fly_root}"
            go run . \
              --datprofile="${GITHUB_WORKSPACE}/config/v2fly/dat-profile.json" \
              --outputdir="${v2fly_output}" \
              --exportlists=geolocation-cn-clean
          )

          git clone --depth 1 \
            https://github.com/MetaCubeX/meta-rules-converter.git \
            "${converter_root}"
          (
            cd "${converter_root}"
            go build -trimpath -o "${RUNNER_TEMP}/meta-rules-converter-bin" .
          )
          "${RUNNER_TEMP}/meta-rules-converter-bin" geosite \
            -f "${v2fly_output}/geolocation-cn.dat" \
            -o "${meta_output}"

          python src/convert_v2fly_geolocation_cn.py \
            --v2fly-export "${v2fly_output}/geolocation-cn-clean.txt" \
            --output dist/mihomo/geolocation-cn.list
          install -m 0644 "${meta_output}/geolocation-cn-clean.mrs" \
            dist/mihomo/geolocation-cn.mrs
          python src/validate_geolocation_cn.py \
            --v2fly-export "${v2fly_output}/geolocation-cn-clean.txt" \
            --domain-list dist/mihomo/geolocation-cn.list \
            --domain-mrs dist/mihomo/geolocation-cn.mrs \
            --v2fly-commit "$(git -C "${v2fly_root}" rev-parse HEAD)" \
            --mrs-converter-commit "$(git -C "${converter_root}" rev-parse HEAD)" \
            --report reports/geolocation-cn.json

      - name: Generate Egern-native rules and APNs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mihomo_commit="$(gh api repos/frostmage1250/mihomo-script/commits/main --jq .sha)"
          bett_commit="$(gh api repos/appshubcc/bett-rules/commits/meta --jq .sha)"
          apns_commit="$(gh api repos/ttyyss2233/Tool/commits/main --jq .sha)"
          echo "MIHOMO_COMMIT=${mihomo_commit}" >> "${GITHUB_ENV}"
          echo "BETT_COMMIT=${bett_commit}" >> "${GITHUB_ENV}"
          echo "APNS_COMMIT=${apns_commit}" >> "${GITHUB_ENV}"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/frostmage1250/mihomo-script/${mihomo_commit}/mihomoScript.js" \
            --output "${RUNNER_TEMP}/mihomoScript.js"
          node src/extract_mihomo_model.js \
            "${RUNNER_TEMP}/mihomoScript.js" > "${RUNNER_TEMP}/mihomo-model.json"
          python - "${RUNNER_TEMP}/mihomo-model.json" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "src")
          model = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          provider = model["providers"]["mcdn屏蔽"]
          private_index = model["rules"].index("RULE-SET,private,Direct")
          assert model["rules"][private_index:private_index + 3] == [
              "RULE-SET,private,Direct",
              "RULE-SET,private_ip,Direct,no-resolve",
              "RULE-SET,mcdn屏蔽,REJECT",
          ], "Private/MCDN consumer priority changed"
          assert model["rules"].count("RULE-SET,mcdn屏蔽,REJECT") == 1, "Duplicate MCDN consumer rule"
          assert provider["format"] == "mrs" and provider["behavior"] == "domain"
          assert provider["url"] == "https://raw.githubusercontent.com/frostmage1250/proxy-rules-converter/main/dist/mihomo/mcdn-block.mrs"
          apple = model["providers"]["apple"]
          assert apple["format"] == "mrs" and apple["behavior"] == "domain"
          from build_egern_rules import resolve_provider_source
          apple_source = resolve_provider_source(apple, bett_commit="pinned", converter_commit="main")
          assert apple_source["repository"] == "appshubcc/bett-rules"
          assert apple_source["path"] == "geo/geosite/apple.list"
          podcasts = model["providers"]["apple_podcasts"]
          podcast_source = resolve_provider_source(podcasts, bett_commit="pinned", converter_commit="main")
          assert podcast_source["path"] == "geo/geosite/apple-podcasts.list"
          assert podcasts["url"] == apple["url"].rsplit("/", 1)[0] + "/apple-podcasts.mrs"
          assert model["rules"].count("RULE-SET,apple_podcasts,Apple Podcasts") == 1
          assert model["rules"].index("RULE-SET,apple_podcasts,Apple Podcasts") < model["rules"].index("RULE-SET,apple_cn,Direct")
          assert model["dns"]["nameserver-policy"]["rule-set:apple_podcasts"] == model["dns"]["nameserver"]
          group = next(item for item in model["groups"] if item["name"] == "Apple Podcasts")
          assert group["proxies"][0] == "Proxy"
          appletv = model["providers"]["appletv"]
          assert appletv["format"] == "mrs" and appletv["behavior"] == "domain"
          assert appletv["url"] == "https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/apple-tvplus.mrs"
          assert model["rules"].count("RULE-SET,appletv,媒体") == 1
          print("Verified pinned Mihomo consumers of MCDN, Bett Apple, Podcasts, and AppleTV.")
          PY
          python src/build_egern_rules.py \
            --model "${RUNNER_TEMP}/mihomo-model.json" \
            --mihomo-commit "${mihomo_commit}" \
            --bett-commit "${bett_commit}" \
            --apns-commit "${apns_commit}"

      - name: Verify AppleTV native publication
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from urllib.request import urlopen
          import sys
          sys.path.insert(0, "src")
          from build_egern_rules import parse_domain_list, merge_ordered_rules
          manifest = json.loads(Path("reports/egern-source.json").read_text(encoding="utf-8"))
          record = next(item for item in manifest["native_rule_sets"] if item["provider"] == "appletv")
          assert record["source_repository"] == "appshubcc/bett-rules"
          assert record["source_path"] == "geo/geosite/apple-tvplus.list"
          assert record["output"] == "dist/egern/appletv.yaml"
          with urlopen(record["source_url"], timeout=60) as response:
              source = response.read().decode("utf-8-sig")
          native = yaml.safe_load(Path(record["output"]).read_text(encoding="utf-8"))
          assert native == merge_ordered_rules(parse_domain_list(source))
          assert set(native) <= {"domain_set", "domain_suffix_set"}
          print(f"Verified AppleTV: {record['entries']} full Bett entries in native Egern YAML.")
          PY

      - name: Verify merged pron MRS and Egern YAML coverage
        shell: bash
        run: |
          mihomo convert-ruleset domain mrs dist/mihomo/porn.mrs "${RUNNER_TEMP}/pron-decoded.list"
          python - "${RUNNER_TEMP}/pron-decoded.list" "${RUNNER_TEMP}/category-porn.list" <<'PY'
          import json, sys
          from pathlib import Path
          import yaml
          sys.path.insert(0, "src")
          from convert_rules import parse_domain_text, parse_porn_source, select_pron_rules, merge_porn_rules, render_rules, sha256_text
          from build_egern_rules import parse_domain_list, merge_ordered_rules
          local = parse_domain_text(Path("config/porn.list").read_text(encoding="utf-8"), "local pron")
          upstream_text = Path(sys.argv[2]).read_text(encoding="utf-8-sig")
          upstream, excluded = parse_porn_source(upstream_text, "category-porn")
          selection = json.loads(Path("config/pron-sites.json").read_text(encoding="utf-8"))
          selected = select_pron_rules(upstream, selection)
          assert all(rule in selected for rule in local), "Local rules must come from selected category-porn entries"
          expected = merge_porn_rules(local, selected)
          assert set(expected) <= set(upstream), "External domains entered pron"
          assert not any(rule.value == root or rule.value.endswith("." + root) for rule in expected for root in selection["excluded_domains"]), "Excluded E-Hentai rules entered pron"
          source = Path("dist/mihomo/porn.list").read_text(encoding="utf-8")
          assert source == render_rules(expected, "mihomo"), "pron text differs from merged source"
          assert len(expected) == len(set(expected)), "pron duplicates remain"
          decoded = parse_domain_text(Path(sys.argv[1]).read_text(encoding="utf-8"), "decoded pron")
          assert len(decoded) == len(expected) and set(decoded) == set(expected), "pron MRS differs from merged source"
          native = yaml.safe_load(Path("dist/egern/porn.yaml").read_text(encoding="utf-8"))
          assert native == merge_ordered_rules(parse_domain_list(source)), "pron Egern YAML differs from merged source"
          assert set(native) <= {"domain_set", "domain_suffix_set"}, "Regex or other rule kinds entered pron"
          report = json.loads(Path("reports/summary.json").read_text(encoding="utf-8"))["porn"]
          assert report["entries"] == len(expected)
          assert report["regex_entries_excluded"] == excluded
          assert report["duplicates_removed"] == len(local) + len(selected) - len(expected)
          assert report["selected_domain_entries"] == len(selected)
          assert report["domain_entries_excluded"] == len(upstream) - len(selected)
          assert report["selected_sites"] == [site["name"] for site in selection["sites"]]
          assert report["source_scope"] == "category-porn only; no external domains"
          assert report["upstream_sha256"] == sha256_text(upstream_text)
          print(f"Verified pron: {len(expected)} domains, {excluded} regex rules excluded, {report['duplicates_removed']} duplicates removed.")
          PY

      - name: Verify merged MCDN MRS and Egern YAML coverage
        shell: bash
        run: |
          mihomo convert-ruleset domain mrs dist/mihomo/mcdn-block.mrs "${RUNNER_TEMP}/mcdn-block-decoded.list"
          python - "${RUNNER_TEMP}/mcdn-block-decoded.list" "${RUNNER_TEMP}/mcdn-adguard.txt" <<'PY'
          import json, sys
          from pathlib import Path
          import yaml
          sys.path.insert(0, "src")
          from convert_rules import merge_mcdn_rules, parse_domain_text, parse_mcdn_adguard, render_rules, sha256_text
          config = json.loads(Path("config/sources.json").read_text(encoding="utf-8"))["mcdn_block"]
          local = parse_domain_text(Path("config/mcdn-block.list").read_text(encoding="utf-8"), "local MCDN")
          upstream_text = Path(sys.argv[2]).read_text(encoding="utf-8-sig")
          upstream = parse_mcdn_adguard(upstream_text, config["url"], config["excluded_rules"])
          expected = merge_mcdn_rules(local, upstream)
          decoded = parse_domain_text(Path(sys.argv[1]).read_text(encoding="utf-8"), "decoded MCDN MRS")
          assert len(expected) == len(set(expected)), "MCDN duplicates remain"
          assert len(expected) == len(decoded) and set(expected) == set(decoded), "MCDN MRS differs from merged source"
          assert Path("dist/mihomo/mcdn-block.list").read_text(encoding="utf-8") == render_rules(expected, "mihomo")
          native = yaml.safe_load(Path("dist/egern/mcdn-block.yaml").read_text(encoding="utf-8"))
          assert native == {"domain_suffix_set": [rule.value for rule in expected]}, "MCDN YAML differs from merged source"
          assert all(rule.kind == "suffix" and "*" not in rule.value for rule in expected)
          assert not any(rule.value == "biliapi.net" for rule in expected), "Excluded wildcard was broadened"
          report = json.loads(Path("reports/summary.json").read_text(encoding="utf-8"))["mcdn_block"]
          assert report["entries"] == len(expected)
          assert report["duplicates_removed"] == len(local) + len(upstream) - len(expected)
          assert report["upstream_sha256"] == sha256_text(upstream_text)
          assert report["excluded_rules"] == config["excluded_rules"]
          print(f"Verified {len(expected)} shared MCDN suffixes; removed {report['duplicates_removed']} identical duplicates.")
          PY

      - name: Verify Bett Apple and Podcasts native publication
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from urllib.request import urlopen
          import yaml
          sys.path.insert(0, "src")
          from build_egern_rules import parse_domain_list, merge_ordered_rules
          manifest = json.loads(Path("reports/egern-source.json").read_text(encoding="utf-8"))
          for provider, asset in (("apple", "apple"), ("apple_podcasts", "apple-podcasts")):
              record = next(item for item in manifest["native_rule_sets"] if item["provider"] == provider)
              assert record["source_repository"] == "appshubcc/bett-rules"
              assert record["source_path"] == f"geo/geosite/{asset}.list"
              assert record["output"] == f"dist/egern/{asset}.yaml"
              with urlopen(record["source_url"], timeout=60) as response:
                  source = response.read().decode("utf-8-sig")
              native = yaml.safe_load(Path(record["output"]).read_text(encoding="utf-8"))
              assert native == merge_ordered_rules(parse_domain_list(source))
              assert record["entries"] == record["source_entries"]
              print(f"Verified {provider}: {record['entries']} Bett rules with original matching scopes.")
          PY

      - name: Verify Egern-only Private Relay publication
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          manifest = json.loads(Path("reports/egern-source.json").read_text(encoding="utf-8"))
          records = manifest["egern_only_rule_sets"]
          assert len(records) == 1 and records[0]["provider"] == "privaterelay"
          record = records[0]
          assert record["egern_only"] is True and record["behavior"] == "domain"
          assert record["output"] == "dist/egern/privaterelay.yaml"
          assert not any(Path("dist/mihomo").glob("*privaterelay*")), "Private Relay must remain Egern-only"
          assert "privaterelay" not in [item["provider"] for item in manifest["native_rule_sets"]]
          native = yaml.safe_load(Path(record["output"]).read_text(encoding="utf-8"))
          assert set(native) <= {"domain_set", "domain_suffix_set"}
          assert sum(len(values) for values in native.values()) == record["entries"]
          assert record["bett_entries"] + record["supplemented_entries"] == record["entries"]
          assert not any("7h15.ru1353t" in value for values in native.values() for value in values)
          print(f"Verified Egern-only Private Relay: {record['bett_entries']} Bett rules plus {record['supplemented_entries']} Sukka rules.")
          PY

      - name: Commit changed generated files
        shell: bash
        run: |
          git add -A -- dist reports
          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push

      - name: Verify renamed and retired provider artifacts
        run: |
          test -s dist/mihomo/porn.list
          test -s dist/mihomo/porn.mrs
          test -s dist/egern/porn.yaml
          for retired in dist/mihomo/apple-merged.list dist/mihomo/apple-merged.mrs dist/egern/apple-merged.yaml config/steam-cn-download-allowlist.txt dist/mihomo/steam-cn-download.list dist/mihomo/steam-cn-download.mrs reports/steam-named-not-reviewed.txt config/bypass-japan.list dist/mihomo/bypass-japan.list dist/mihomo/bypass-japan.mrs dist/egern/bypass-japan.yaml; do
            test ! -e "${retired}"
          done

      - name: Verify published Egern rule files
        shell: bash
        run: |
          set -euo pipefail
          published_commit="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "${published_commit}" = "${remote_commit}"
          while IFS= read -r file; do
            remote_file="${RUNNER_TEMP}/published-${file//\//-}"
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/frostmage1250/proxy-rules-converter/${published_commit}/${file}" \
              --output "${remote_file}"
            cmp --silent "${file}" "${remote_file}"
          done < <(printf '%s\n' reports/egern-source.json; find dist/egern -maxdepth 1 -type f -name '*.yaml' -printf '%p\n' | sort)
          echo "Verified published Egern rules at ${published_commit}."

      - name: Verify published local Mihomo MRS files
        shell: bash
        run: |
          set -euo pipefail
          published_commit="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "${published_commit}" = "${remote_commit}"
          for file in dist/mihomo/porn.list dist/mihomo/porn.mrs dist/mihomo/mcdn-block.list dist/mihomo/mcdn-block.mrs; do
            test -s "${file}"
            remote_file="${RUNNER_TEMP}/published-${file//\//-}"
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/frostmage1250/proxy-rules-converter/${published_commit}/${file}" \
              --output "${remote_file}"
            cmp --silent "${file}" "${remote_file}"
          done
          echo "Verified published local Mihomo MRS files at ${published_commit}."
