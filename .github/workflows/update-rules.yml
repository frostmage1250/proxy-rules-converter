name: Update generated rules

on:
  workflow_dispatch:
  schedule:
    # 18:23 UTC = 02:23 Asia/Shanghai (the following day).
    - cron: "23 18 * * *"

permissions:
  contents: write

env:
  MIHOMO_VERSION: v1.19.28
  MIHOMO_LINUX_AMD64_SHA256: 70d01cfb8cb7bf7a92fd1af16cb4b9553d90bb4eecde3b5c4849103e27c80ddb

concurrency:
  group: update-generated-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install official Mihomo converter
        shell: bash
        run: |
          asset="mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          archive="${RUNNER_TEMP}/${asset}"
          curl --fail --location --silent --show-error \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${asset}" \
            --output "${archive}"
          echo "${MIHOMO_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod +x "${RUNNER_TEMP}/mihomo"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/mihomo" -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch, convert, and validate rules
        run: |
          python src/convert_rules.py
          python src/convert_mrs.py

      - name: Verify generated files are deterministic
        run: |
          python src/convert_rules.py --check
          python src/convert_mrs.py --check
          git diff --check

      - name: Commit changed generated files
        shell: bash
        run: |
          git add -A -- dist reports
          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push
