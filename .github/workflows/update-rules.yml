name: Update generated rules

on:
  workflow_dispatch:
  schedule:
    # 18:23 UTC = 02:23 Asia/Shanghai (the following day).
    - cron: "23 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-generated-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch, convert, and validate rules
        run: python src/convert_rules.py

      - name: Check generated text formatting
        run: git diff --check

      - name: Commit changed generated files
        shell: bash
        run: |
          git add dist reports
          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push
